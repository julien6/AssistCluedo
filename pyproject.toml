[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "assistcluedo"
version = "0.1.0"
description = "A deterministic terminal investigation game."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "AssistCluedo"}]
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
assistcluedo = "assistcluedo.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.package-data]
assistcluedo = ["scenario_packs/*/*.yaml"]
